<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maré</title>
<link rel="stylesheet" href="/estilo.css">
<style>
  body { background: #e8dcc4; overflow: hidden; }
  main { position: relative; z-index: 2; }
  .areia { position: fixed; left: 0; right: 0; bottom: 18vh; text-align: center; z-index: 1;
           font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 42px; color: #9c8a6b; letter-spacing: .12em; }
  .agua { position: fixed; left: -10%; right: -10%; bottom: 0; height: 12vh; z-index: 3;
          background: linear-gradient(#3f6e7d, #1d3440); opacity: .92;
          transition: height 3s ease; border-radius: 45% 55% 0 0 / 18px 22px 0 0;
          animation: ondular 6s ease-in-out infinite alternate; }
  @keyframes ondular { from { transform: translateX(-2%) } to { transform: translateX(2%) } }
</style>
</head>
<body>
<main class="centro">
  <p>A maré não sobe mais rápido porque você está com pressa.</p>
</main>
<div class="areia" id="areia"></div>
<div class="agua" id="agua"></div>
<script>
(function () {
  var t = '', agua = document.getElementById('agua'), areia = document.getElementById('areia');
  function nivel(p) { agua.style.height = (12 + p * 60) + 'vh'; }
  function perguntar(novo) {
    fetch('/api/mare' + (novo || !t ? '' : '?t=' + encodeURIComponent(t)))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        t = d.t; nivel(d.p);
        if (d.palavra) { areia.textContent = d.palavra; setTimeout(function () { nivel(0); }, 1500); }
      });
  }
  var espera = null;
  function mexeu() {
    if (areia.textContent) return;
    clearTimeout(espera);
    espera = setTimeout(function () { perguntar(true); }, 400);
    nivel(0);
  }
  ['mousemove', 'mousedown', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(function (e) {
    window.addEventListener(e, mexeu, { passive: true });
  });
  perguntar(true);
  setInterval(function () { if (!areia.textContent) perguntar(false); }, 20000);
})();
</script>
</body>
</html>
