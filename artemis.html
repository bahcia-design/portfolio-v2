<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>para ela</title>
<link rel="stylesheet" href="/estilo.css">
<style>
  body { background: radial-gradient(ellipse at 50% 35%, #1f3340 0%, #121d25 60%, #0b1217 100%); color: #e8ddc9; min-height: 100vh; }
  main { padding-top: 40px; }
  .bolo { display: block; width: 100%; max-width: 560px; margin: 0 auto 28px; overflow: visible; }
  .brilho { animation: tremer 2.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .b2 { animation-duration: 1.7s; animation-delay: -.6s; }
  .b3 { animation-duration: 2.6s; animation-delay: -1.3s; }
  .fumaca { animation: subir 3.5s ease-in-out infinite; }
  .estrela { animation: piscar 4s ease-in-out infinite; }
  @keyframes tremer { from { opacity: 1; transform: scale(1) } to { opacity: .82; transform: scale(.92) } }
  @keyframes subir { 0%,100% { opacity: .25 } 50% { opacity: .55 } }
  @keyframes piscar { 0%,100% { opacity: .15 } 50% { opacity: .7 } }
  p { color: #cfc3ad; font-style: italic; }
</style>
</head>
<body>
<main class="centro">
  <svg class="bolo" id="bolo" viewBox="0 0 640 640" aria-label="bolo visto de cima"></svg>
  <p>Redondo, pra parecer com ela. Aceso, pra brilhar como ela.</p>
</main>
<script>
(function () {
  var dentro = '101', volta = '01101011110111101110';
  var svg = document.getElementById('bolo'), ns = 'http://www.w3.org/2000/svg';
  var C = 320, semente = 7;
  function rnd() { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; }
  function el(tag, attrs, pai) { var e = document.createElementNS(ns, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); (pai || svg).appendChild(e); return e; }

  var defs = el('defs', {});
  defs.innerHTML =
    '<radialGradient id="prato" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#e9edf0"/><stop offset=".8" stop-color="#b9c4cb"/><stop offset="1" stop-color="#8d9ba4"/></radialGradient>' +
    '<radialGradient id="topo" cx=".42" cy=".38" r=".75"><stop offset="0" stop-color="#fffdf7"/><stop offset=".7" stop-color="#f4e9d8"/><stop offset="1" stop-color="#e6d6bd"/></radialGradient>' +
    '<radialGradient id="concha" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e3d1b6"/></radialGradient>' +
    '<radialGradient id="luz"><stop offset="0" stop-color="#fff6cf"/><stop offset=".3" stop-color="#ffc861" stop-opacity=".95"/><stop offset=".65" stop-color="#f59a3a" stop-opacity=".35"/><stop offset="1" stop-color="#f59a3a" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="lua" cx=".5" cy=".5" r=".5"><stop offset=".7" stop-color="#cfe0ea" stop-opacity=".35"/><stop offset="1" stop-color="#cfe0ea" stop-opacity="0"/></radialGradient>' +
    '<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>' +
    '<filter id="mini" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#6b4a2a" flood-opacity=".45"/></filter>';

  for (var s = 0; s < 40; s++) {
    var st = el('circle', { class: 'estrela', cx: rnd() * 640, cy: rnd() * 640, r: .8 + rnd() * 1.3, fill: '#e8ddc9' });
    st.style.animationDelay = (-rnd() * 4) + 's';
  }

  el('circle', { cx: C, cy: C, r: 316, fill: 'url(#lua)' });
  el('circle', { cx: C, cy: C, r: 292, fill: 'url(#prato)', filter: 'url(#sombra)' });
  el('circle', { cx: C, cy: C, r: 268, fill: 'none', stroke: '#fff', 'stroke-opacity': .5, 'stroke-width': 2 });
  el('circle', { cx: C, cy: C, r: 262, fill: '#dfc9a6' });

  var N = 44;
  for (var i = 0; i < N; i++) {
    var a = i / N * Math.PI * 2, x = C + 246 * Math.cos(a), y = C + 246 * Math.sin(a);
    el('ellipse', { cx: x, cy: y, rx: 15, ry: 10, fill: 'url(#concha)', transform: 'rotate(' + (a * 180 / Math.PI + 90) + ' ' + x + ' ' + y + ')', filter: 'url(#mini)' });
  }
  el('circle', { cx: C, cy: C, r: 226, fill: 'url(#topo)' });
  el('circle', { cx: C, cy: C, r: 226, fill: 'none', stroke: '#fff', 'stroke-opacity': .6, 'stroke-width': 2 });

  [[-70, -50, 54], [90, 60, 40], [-40, 100, 34], [60, -95, 28]].forEach(function (c) {
    el('circle', { cx: C + c[0], cy: C + c[1], r: c[2], fill: '#d8c6a8', 'fill-opacity': .22 });
    el('circle', { cx: C + c[0] - c[2] * .15, cy: C + c[1] - c[2] * .15, r: c[2] * .75, fill: '#fff', 'fill-opacity': .35 });
  });

  var P = 62;
  for (var p = 0; p < P; p++) {
    var b = p / P * Math.PI * 2;
    el('circle', { cx: C + 205 * Math.cos(b), cy: C + 205 * Math.sin(b), r: 3.6, fill: '#fffaf0', stroke: '#d9c6a7', 'stroke-width': .8 });
  }

  var velas = [];
  for (var j = 0; j < volta.length; j++) {
    var ang = -Math.PI / 2 + j / volta.length * Math.PI * 2;
    velas.push({ x: C + 160 * Math.cos(ang), y: C + 160 * Math.sin(ang), on: volta[j] === '1' });
  }
  for (var k = 0; k < dentro.length; k++) velas.push({ x: C - 44 + k * 44, y: C + 6, on: dentro[k] === '1' });

  var cores = ['#b0452d', '#2f6f7a', '#e0a13a'];
  for (var g = 0; g < 70; g++) {
    var ra = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * 190, sx = C + rr * Math.cos(ra), sy = C + rr * Math.sin(ra);
    var livre = velas.every(function (v) { return Math.hypot(v.x - sx, v.y - sy) > 34; });
    if (!livre) continue;
    el('rect', { x: sx - 5, y: sy - 1.6, width: 10, height: 3.2, rx: 1.6, fill: cores[g % 3], transform: 'rotate(' + (rnd() * 180) + ' ' + sx + ' ' + sy + ')' });
  }

  velas.forEach(function (v, n) {
    el('circle', { cx: v.x + 2, cy: v.y + 4, r: 10, fill: '#000', 'fill-opacity': .18 });
    el('circle', { cx: v.x, cy: v.y, r: 10, fill: n % 2 ? '#f6ead3' : '#e9d0c6', stroke: '#c7a98a', 'stroke-width': 1.2 });
    el('circle', { cx: v.x, cy: v.y, r: 6.5, fill: 'none', stroke: n % 2 ? '#b0452d' : '#2f6f7a', 'stroke-width': 1.6, 'stroke-dasharray': '4 3' });
    if (v.on) {
      el('circle', { class: 'brilho b' + (n % 3 + 1), cx: v.x, cy: v.y, r: 34, fill: 'url(#luz)' });
      el('circle', { cx: v.x, cy: v.y, r: 3.6, fill: '#fffbe8' });
    } else {
      el('circle', { cx: v.x, cy: v.y, r: 2.4, fill: '#3a2e27' });
      el('path', { class: 'fumaca', d: 'M' + v.x + ' ' + (v.y - 6) + ' c-6 -8 6 -13 0 -21', fill: 'none', stroke: '#8d8579', 'stroke-width': 1.3, 'stroke-linecap': 'round' });
    }
  });
})();
</script>
</body>
</html>
