<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portfólio — paletas</title>
<link rel="stylesheet" href="/estilo.css">
<style>
  body { background: #faf8f4; }
  main { max-width: 880px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-top: 40px; }
  .card { margin: 0; }
  .cor { aspect-ratio: 1; border-radius: 4px; }
  .card figcaption { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8a8178; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Paletas, 2019–2026</h1>
  <p>Toda cor tem um nome. Às vezes, só três letras.</p>
  <div class="grade">
    <figure class="card"><div class="cor" style="background:#6f2070"></div><figcaption>01 · ameixa</figcaption></figure>
    <figure class="card"><div class="cor" style="background:#726f78"></div><figcaption>02 · névoa</figcaption></figure>
    <figure class="card"><div class="cor" style="background:#696d6f"></div><figcaption>03 · ardósia</figcaption></figure>
    <figure class="card"><div class="cor" style="background:#20706f"></div><figcaption>04 · lagoa</figcaption></figure>
    <figure class="card"><div class="cor" style="background:#72746f"></div><figcaption>05 · musgo seco</figcaption></figure>
    <figure class="card"><div class="cor" style="background:#3a202f"></div><figcaption>06 · vinho</figcaption></figure>
    <figure class="card"><div class="cor" style="background:#616e63"></div><figcaption>07 · sálvia</figcaption></figure>
    <figure class="card"><div class="cor" style="background:#6f7261"></div><figcaption>08 · oliva</figcaption></figure>
  </div>
</main>
</body>
</html>
