<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soprei algumas</title>
<link rel="stylesheet" href="/estilo.css">
<style>
  body { background: #1b1714; color: #e9dfcf; }
  .bolo { display: block; width: 100%; max-width: 760px; margin: 56px auto 0; }
  .vela { fill: #e9dfcf; }
  .chama { fill: #f0a93c; filter: drop-shadow(0 0 6px #f0a93c); animation: tremer 1.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .6s; }
  .fumaca { fill: none; stroke: #6b625a; stroke-width: 1.2; opacity: .7; }
  .fumaca-texto { white-space: pre; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 26px; fill: #8d847b; letter-spacing: .08em; opacity: 0; transition: opacity 4s ease; }
  @keyframes tremer { from { transform: scaleY(1) } to { transform: scaleY(.85) skewX(3deg) } }
</style>
</head>
<body>
<main class="centro">
  <svg class="bolo" id="bolo" viewBox="0 0 720 320" aria-label="bolo com velas"></svg>
</main>
<script>
(function () {
  var velas = '1011001101111100001001000101';
  var svg = document.getElementById('bolo'), ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, pai) { var e = document.createElementNS(ns, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); (pai || svg).appendChild(e); return e; }
  el('rect', { x: 20, y: 220, width: 680, height: 80, rx: 10, fill: '#5a3a2e' });
  el('rect', { x: 20, y: 220, width: 680, height: 14, rx: 7, fill: '#e9dfcf' });
  var chamas = [], x = 34;
  for (var i = 0; i < velas.length; i++) {
    if (i === 3) x += 18;
    el('rect', { class: 'vela', x: x, y: 160, width: 8, height: 60, rx: 2 });
    if (velas[i] === '1') chamas.push(el('path', { class: 'chama', d: 'M' + (x + 4) + ' 136 c7 10 7 17 0 21 c-7 -4 -7 -11 0 -21z' }));
    else el('path', { class: 'fumaca', d: 'M' + (x + 4) + ' 156 c-5 -6 5 -10 0 -16 c-5 -6 5 -10 0 -16' });
    x += 23;
  }
  var texto = el('text', { class: 'fumaca-texto', x: 360, y: 70, 'text-anchor': 'middle' });

  var digitado = '', ouvindo = false;
  window.addEventListener('keydown', function (e) {
    if (ouvindo || e.key.length !== 1) return;
    digitado = (digitado + e.key.toLowerCase()).slice(-5);
    if (digitado.indexOf('sopr') !== -1) escutar();
  });

  function escutar() {
    ouvindo = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return semAr();
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      ctx.resume();
      var an = ctx.createAnalyser(); an.fftSize = 1024;
      ctx.createMediaStreamSource(stream).connect(an);
      var buf = new Float32Array(an.fftSize), forte = 0, apagadas = 0;
      var relogio = setInterval(function ouvir() {
        an.getFloatTimeDomainData(buf);
        var s = 0; for (var j = 0; j < buf.length; j++) s += buf[j] * buf[j];
        var rms = Math.sqrt(s / buf.length);
        forte = rms > 0.12 ? forte + 1 : Math.max(0, forte - 2);
        if (forte > 8 && apagadas < chamas.length) { chamas[apagadas++].style.opacity = 0; forte = 4; }
        if (apagadas >= chamas.length) {
          clearInterval(relogio); stream.getTracks().forEach(function (t) { t.stop(); });
          texto.textContent = atob('My44LjEgICAxLjIuMiAgIDEuMy4yICAgMy4yLjI=');
          setTimeout(function () { texto.style.opacity = 1; }, 1200);
          return;
        }
      }, 40);
    }, semAr);
  }
  function semAr() {
    ouvindo = false;
    texto.textContent = 'sem fôlego? eu espero.';
    texto.style.opacity = 1;
  }
})();
</script>
</body>
</html>
